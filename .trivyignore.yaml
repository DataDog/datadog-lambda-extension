# Suppressions for the `bottlecap/Cargo.lock` scans in
# `.github/workflows/rs_ci.yml` and `.github/workflows/vulnerability-scan.yml`.
#
# `Cargo.lock` covers build and dev dependencies as well as the crates linked
# into the extension, so it over-reports relative to what ships. The dependency
# list embedded in the released binary is the authoritative view of the shipped
# artifact.
vulnerabilities:
  - id: GHSA-3pv8-6f4r-ffg2
    statement: |
      `tar` is a build dependency of `libddwaf-sys`, used by its build script.
      It is not linked into the extension binary: `cargo tree -i tar -e normal`
      reports nothing, while `-e build,normal` reports the build-script edge.
  - id: GHSA-2mjx-qc3c-rqvc
    statement: |
      Same advisory as RUSTSEC-2026-0285, ignored for cargo-audit in
      `bottlecap/.cargo/audit.toml`. The fix is in rustls >= 0.23.45, which
      requires aws-lc-rs >= 1.18 and so AWS-LC-FIPS 4.x, pending FIPS 140-3
      certification. Remove this entry together with that ignore.
