# Throwaway diagnostic spike: replaces the normal pipeline, including all
# publishing jobs. Start it manually from the GitLab UI or the pipelines API on
# this branch. Do not merge this pipeline replacement.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "lpimentel/spike-compile-sampler" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - when: never

stages: [spike]

.sampled-compile:
  stage: spike
  image: registry.ddbuild.io/images/docker:20.10
  # Bound the whole job above the script's own 25m compile bound.
  timeout: 30m
  # No native retry. Platform automation can still add an attempt; treat that as
  # a second sample, not as a broken spike.
  retry: 0
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - sampler.log
      - build.log
  script:
    - .gitlab/scripts/sample_compile.sh

# Slowest variant and the highest timeout count historically. Stalls traced on
# this Dockerfile path happen inside the final compile step.
bottlecap sampled (arm64, fips, alpine):
  extends: .sampled-compile
  tags: ["arch:arm64"]
  parallel: 2
  variables:
    ARCHITECTURE: arm64
    ALPINE: 1
    FIPS: 1
    FILE_SUFFIX: arm64-alpine-fips

# Fastest variant, and the Dockerfile path where two traced stalls stopped at a
# step boundary rather than mid-step.
bottlecap sampled (amd64):
  extends: .sampled-compile
  tags: ["arch:amd64"]
  parallel: 2
  variables:
    ARCHITECTURE: amd64
    ALPINE: 0
    FIPS: 0
    FILE_SUFFIX: amd64
