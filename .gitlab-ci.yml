# Throwaway spike: replaces the normal pipeline, including all publishing jobs.
# Start manually from the GitLab UI or pipelines API on this branch.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "lpimentel/spike-buildx-version" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - when: never

stages: [spike]

buildx provenance:
  stage: spike
  image: registry.ddbuild.io/images/docker:20.10
  parallel:
    matrix:
      - ARCHITECTURE: [amd64, arm64]
  tags: ["arch:${ARCHITECTURE}"]
  timeout: 3m
  retry: 0
  script:
    - sh .gitlab/scripts/probe_buildx.sh
