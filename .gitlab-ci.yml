# Throwaway spike: replaces the normal pipeline, including all publishing jobs.
# Start manually from the GitLab UI or pipelines API on this branch.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "lpimentel/spike-timeout-retry" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - when: never

stages: [spike]

.timeout-probe:
  stage: spike
  image: registry.ddbuild.io/images/docker:20.10
  tags: ["arch:amd64"]
  timeout: 2m
  script:
    - 'echo "Intentional job timeout: ${CI_JOB_NAME}, job ${CI_JOB_ID}"'
    - sleep 300

retry control:
  extends: .timeout-probe
  retry:
    max: 1
    when:
      - stuck_or_timeout_failure

retry treatment:
  extends: .timeout-probe
  retry:
    max: 1
    when:
      - job_execution_timeout
