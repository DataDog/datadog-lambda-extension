# Throwaway client comparison. Do not merge this pipeline replacement.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "lpimentel/spike-buildx-upgrade" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - when: never

stages: [spike]

.buildx-comparison:
  stage: spike
  image: registry.ddbuild.io/images/docker:20.10
  timeout: 25m
  # Platform automation may still retry. Count those attempts separately.
  retry: 0
  parallel:
    matrix:
      - BUILDX_ARM: [current, upgraded]
        REPLICA: ["1", "2"]
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - buildx-spike.log
      - build.log
      - result.txt
  script:
    - .gitlab/scripts/compare_buildx.sh

buildx comparison (amd64):
  extends: .buildx-comparison
  tags: ["arch:amd64"]
  variables:
    ARCHITECTURE: amd64
    ALPINE: "0"
    FIPS: "0"
    FILE_SUFFIX: amd64

buildx comparison (arm64, fips, alpine):
  extends: .buildx-comparison
  tags: ["arch:arm64"]
  variables:
    ARCHITECTURE: arm64
    ALPINE: "1"
    FIPS: "1"
    FILE_SUFFIX: arm64-alpine-fips
