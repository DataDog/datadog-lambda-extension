# Nextest configuration for the bottlecap workspace (CI runs `cargo nextest run
# --workspace` from this directory, see .github/workflows/rs_ci.yml).
#
# Nextest runs every test in its own process, so `#[serial]` cannot protect a
# fixed port across test binaries. The process-level contract tests spawn the
# real `bottlecap` binary, which binds 8124, 8125/udp, 8126, 8999 and 9000.
# Those binaries go in the `fixed-ports` group: one test at a time, across all
# of them. See tests/HARNESS.md.

[test-groups]
fixed-ports = { max-threads = 1 }

# A regex so the config stays valid when one of these binaries is absent
# (nextest rejects an exact `binary(name)` that matches nothing).
[[profile.default.overrides]]
filter = 'binary(/(^|_)(lifecycle_contract|fault_injection|config_robustness|port_conflict)_test$/)'
test-group = "fixed-ports"
# A debug build of the extension, a blocking flush and a shutdown deadline add
# up; the longest test (a storm with a memory window) stays under this.
slow-timeout = { period = "60s", terminate-after = 3 }
